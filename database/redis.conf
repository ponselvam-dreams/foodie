# Redis configuration file example

# Bind to all network interfaces (0.0.0.0) or specify a specific IP address
bind 0.0.0.0

# Port to listen on
port 6379

# Enable protected mode (recommended for production)
protected-mode yes

# Set a password for Redis (recommended for production)
requirepass foodieai@123

# Maximum memory usage (e.g., 256MB)
# maxmemory 256mb

# Eviction policy when maxmemory is reached
# volatile-lru: evict keys with an expire set, least recently used
# allkeys-lru: evict any key, least recently used
# volatile-random: evict keys with an expire set, randomly
# allkeys-random: evict any key, randomly
# volatile-ttl: evict keys with an expire set, shortest time to live
# noeviction: don't evict anything, just return an error on write operations
maxmemory-policy allkeys-lru

# Append-only file persistence (recommended for durability)
appendonly yes

# Append-only file name
appendfilename "appendonly.aof"

# Append-only file fsync policy (always, everysec, no)
# always: fsync after every write
# everysec: fsync every second
# no: never fsync (not recommended)
appendfsync everysec

# RDB snapshot persistence (optional)
# save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

# RDB file name
dbfilename dump.rdb

# Directory where to save RDB and AOF files
dir /data

# Log level (debug, verbose, notice, warning)
loglevel notice

# Log file path
logfile "/var/log/redis/redis-server.log"

# Number of databases
databases 16

# Enable Redis Cluster support (optional)
# cluster-enabled yes

# Cluster configuration file name
# cluster-config-file nodes.conf

# Cluster node timeout
# cluster-node-timeout 15000

# Enable Redis Sentinel support (optional)
# sentinel monitor mymaster 127.0.0.1 6379 2